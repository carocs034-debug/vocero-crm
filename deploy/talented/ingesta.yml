# Opt-in: agregar SOLO al autorizar el acceso dedicado del piloto.
# Rutas exactas del piloto con X-Reclutamiento-Key; el resto conserva BasicAuth y login.
services:
  app:
    labels:
      - traefik.http.routers.talented-ingesta.rule=Host(`dev-crm.talentedmx.com`) && Path(`/api/integraciones/reclutamiento/ingesta`)
      - traefik.http.routers.talented-ingesta.priority=100
      - traefik.http.routers.talented-ingesta.entrypoints=websecure
      - traefik.http.routers.talented-ingesta.tls.certresolver=letsencrypt
      - traefik.http.routers.talented-ingesta.service=talented-dev
      - traefik.http.routers.talented-vacantes.rule=Host(`dev-crm.talentedmx.com`) && Path(`/api/integraciones/reclutamiento/vacantes`) && Method(`GET`)
      - traefik.http.routers.talented-vacantes.priority=100
      - traefik.http.routers.talented-vacantes.entrypoints=websecure
      - traefik.http.routers.talented-vacantes.tls.certresolver=letsencrypt
      - traefik.http.routers.talented-vacantes.service=talented-dev
